# 순수 함수 단위 테스트 + 타입체크 + 린트 (#78).
#
# `next build`는 넣지 않는다 — 빌드는 DB/KIS/LLM 자격증명이 있어야 통과하므로 CI에
# 시크릿을 들이게 되고, 이 워크플로가 잡으려는 종류의 결함(상태 조합 누락)은 빌드가
# 잡아주지 않는다. 배포 검증은 Vercel이 맡는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
